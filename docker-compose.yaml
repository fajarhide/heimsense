version: "3.8"

services:
  heimsense:
    build:
      context: .
      dockerfile: Containerfile
    image: heimsense:latest
    container_name: heimsense
    ports:
      - "8080:8080"
    volumes:
      - ~/.heimsense/config.toml:/.heimsense/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
